name: Update PCI ID Mappings

on:
  # Run manually from the Actions tab
  workflow_dispatch:
  # Run on a schedule (e.g., once a day at midnight UTC)
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-mappings:
    runs-on: ubuntu-latest
    # Add permissions for contents
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # This is important - it ensures the token used has push access
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run mapping script
      run: |
        python models.py
        
    - name: Commit and push if changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -A
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update PCI ID mappings"
          # Using the GITHUB_TOKEN to authenticate the push
          git push
        fi
